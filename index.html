<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend: Habit Quest</title>
<meta name="description" content="A habit tracker built like a game. Build streaks, level up, fight the weekly boss, and pay the price when you slack.">
<meta name="theme-color" content="#0a0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preload" href="assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="atmos" aria-hidden="true"><i class="vig"></i><i class="grain"></i></div>

<div id="damage-vignette" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div id="cursor" aria-hidden="true"><i class="dot"></i><i class="ring"></i></div>

<div id="app">
  <header id="hud" class="hud"></header>
  <main id="view" tabindex="-1"></main>
  <nav id="dock" class="dock glass" aria-label="Primary"></nav>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="overlay"></div>

<div id="preloader" aria-hidden="true">
  <div class="pl-word"><span>Ascend</span></div>
  <div class="pl-bar"><i></i></div>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px sans-serif">Ascend needs JavaScript to run.</p></noscript>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/sound.js"></script>
<script src="js/game.js"></script>
<script src="js/fx.js"></script>
<script src="js/motion.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/quests.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/alarms.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/sanctuary.js"></script>
<script src="js/views/vault.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/alarm-engine.js"></script>
<script src="js/scene.bundle.js"></script>
<script src="js/main.js"></script>
</body>
</html>

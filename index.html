<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend — Habit Quest</title>
<meta name="description" content="A gamified habit tracker in liquid glass. Build streaks, level up, fight the weekly boss — and pay the price when you slack.">
<meta name="theme-color" content="#07060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<!-- Ambient liquid backdrop: the glass refracts this -->
<div class="backdrop" aria-hidden="true">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i><i class="orb o5"></i>
  <div class="grain"></div>
</div>

<!-- SVG refraction filter used by the dock / HUD on Chromium -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="damage-vignette" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="app">
  <header id="hud" class="hud glass"></header>
  <main id="view" tabindex="-1"></main>
  <nav id="dock" class="dock glass" aria-label="Primary"></nav>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="overlay"></div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px sans-serif">Ascend needs JavaScript to run.</p></noscript>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/quests.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/alarms.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/vault.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/alarm-engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
